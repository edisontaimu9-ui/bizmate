<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BizMate — Your business assistant</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="card">
      <div class="brand">BizMate</div>
      <div class="tagline">Your business. Your knowledge. Your assistant.</div>

      <form id="auth-form">
        <div id="name-field" style="display:none">
          <label for="displayName">Your name</label>
          <input id="displayName" type="text" autocomplete="name" />
        </div>

        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="email" />

        <label for="password">Password</label>
        <input id="password" type="password" required autocomplete="current-password" minlength="6" />

        <button type="submit" id="submit-btn">Sign in</button>
        <div class="error-text" id="error-text"></div>
      </form>

      <div class="switch-link">
        <span id="switch-copy">Don't have an account?</span>
        <a href="#" id="switch-link">Sign up</a>
      </div>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
