<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — BizMate</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="shell">
    <nav class="topnav">
      <span class="brand">BizMate</span>
      <a href="dashboard.html" class="active">My Business</a>
      <a href="products.html">Products</a>
      <a href="knowledge.html">Knowledge</a>
    </nav>

    <div class="content">
      <div class="page-title" id="business-name">Loading…</div>
      <div class="page-subtitle">Your business assistant is ready.</div>

      <div class="form-card">
        <h3>Next steps</h3>
        <p style="color:#6b7573; font-size:14px; margin: 8px 0 0;">
          Add your <a href="products.html">products or services</a> and your
          <a href="knowledge.html">knowledge</a> (FAQs and instructions) —
          that's what your assistant uses to answer customers. Conversations
          and WhatsApp connection land in the next phases.
        </p>
      </div>
    </div>
  </div>

  <script type="module">
    import { firebaseConfig } from "../js/firebase-config.js";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { apiFetch } from "../js/api.js";

    initializeApp(firebaseConfig);
    onAuthStateChanged(getAuth(), async (user) => {
      if (!user) return (window.location.href = "../index.html");
      try {
        const business = await apiFetch("/api/business");
        document.getElementById("business-name").textContent = business.name;
      } catch (err) {
        document.getElementById("business-name").textContent = "Could not load business";
      }
    });
  </script>
</body>
</html>
