<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products — BizMate</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="shell">
    <nav class="topnav">
      <span class="brand">BizMate</span>
      <a href="dashboard.html">My Business</a>
      <a href="products.html" class="active">Products</a>
      <a href="knowledge.html">Knowledge</a>
      <a href="test-chat.html">Test Chat</a>
      <a href="conversations.html">Conversations</a>
    </nav>

    <div class="content">
      <div class="page-title">Products &amp; Services</div>
      <div class="page-subtitle">What your assistant can tell customers you sell.</div>

      <div class="form-card">
        <h3 id="form-title">Add a product or service</h3>
        <form id="product-form">
          <input type="hidden" id="edit-id" />
          <div class="form-row">
            <div>
              <label for="type">Type</label>
              <select id="type">
                <option value="product">Product</option>
                <option value="service">Service</option>
              </select>
            </div>
            <div>
              <label for="availability">Availability</label>
              <select id="availability">
                <option value="available">Available</option>
                <option value="unavailable">Unavailable</option>
              </select>
            </div>
          </div>

          <label for="name">Name</label>
          <input id="name" type="text" required placeholder="e.g. Air Runner" />

          <label for="description">Description</label>
          <textarea id="description" rows="2" placeholder="e.g. Sizes 38–44, breathable mesh"></textarea>

          <div class="form-row">
            <div>
              <label for="price">Price</label>
              <input id="price" type="number" step="0.01" min="0" placeholder="45000" />
            </div>
            <div>
              <label for="currency">Currency</label>
              <input id="currency" type="text" value="MWK" maxlength="6" />
            </div>
          </div>

          <label for="category">Category</label>
          <input id="category" type="text" placeholder="e.g. Footwear" />

          <label for="photo">Photo (optional)</label>
          <input id="photo" type="file" accept="image/jpeg,image/png,image/webp" class="file-input" />

          <button type="submit" id="submit-btn">Add product</button>
          <button type="button" id="cancel-edit" class="small-btn secondary-btn" style="display:none; margin-top:8px; width:100%;">Cancel edit</button>
          <div class="error-text" id="error-text"></div>
        </form>
      </div>

      <div class="item-list" id="product-list"></div>
      <div class="empty-state" id="empty-state" style="display:none">No products yet — add your first one above.</div>
    </div>
  </div>

  <script type="module" src="../js/products.js"></script>
</body>
</html>
